<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- Pas de viewport-fit=cover : sur iPhone le contenu reste dans la zone sûre (ni sous l'encoche / l'île dynamique, ni sous la barre du bas). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="app-version" content="dev">
    <title>Surf Log</title>
    <script src="diag.js"></script>
    <meta name="description" content="Prévisions surf : houle, vent, marées, journal de bord.">
    <meta name="theme-color" content="#0D1B22">
    <!-- iPhone : "Ajouter à l'écran d'accueil" ouvre Surf Log en plein écran, comme une app. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Surf Log">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0D1B22; }
        #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
                   justify-content: center; color: #9fb3bd; font: 15px -apple-system, system-ui, sans-serif; gap: 16px; }
        #loading img { width: 96px; height: 96px; }
    </style>
</head>
<body>
<div id="loading">
    <img src="icon-192.png" alt="">
    <div id="loading-text">Chargement de Surf Log…</div>
</div>
<script>
    // Retour sur l'onglet après un passage en arrière-plan (iPhone surtout) : Safari retire le rendu graphique (WebGL) aux onglets
    // qu'on quitte, et le moteur de dessin de l'appli ne sait pas repartir sans lui : l'écran restait vide ou figé jusqu'à ce qu'on
    // recharge à la main (reproduit avec le moteur de Safari, 28 novembre). Quand le rendu est perdu, on recharge la page dès qu'elle
    // est visible : les réglages et le spot choisi sont gardés sur l'appareil, l'appli revient telle quelle.
    (function () {
        var pending = false;
        function allowed() {
            // Garde-fou : deux rechargements au plus en trois minutes, pour ne jamais tourner en boucle.
            try {
                var now = Date.now();
                var list = JSON.parse(sessionStorage.getItem("surflog_recover") || "[]").filter(function (t) { return now - t < 180000; });
                if (list.length >= 2) return false;
                list.push(now);
                sessionStorage.setItem("surflog_recover", JSON.stringify(list));
            } catch (e) {}
            return true;
        }
        window.__recover = function (reason) {
            if (window.__diagPush) window.__diagPush("reprise", reason);
            if (document.visibilityState === "hidden") { pending = true; return true; }
            if (!allowed()) return false;
            location.reload();
            return true;
        };
        function lost(canvas) {
            try {
                var gl = canvas.getContext("webgl2") || canvas.getContext("webgl");
                return !!gl && gl.isContextLost();
            } catch (e) { return false; }
        }
        // Le canvas de l'appli est dans un shadow DOM : l'événement « contexte perdu » ne remonte pas jusqu'au document, on l'écoute sur le canvas.
        var watched = null;
        setInterval(function () {
            var c = window.__findCanvas && window.__findCanvas();
            if (!c || c === watched) return;
            watched = c;
            c.addEventListener("webglcontextlost", function (e) { e.preventDefault(); window.__recover("rendu graphique perdu"); }, false);
        }, 1000);
        function check() {
            if (pending) { pending = false; if (window.__recover("rendu perdu pendant l'arrière-plan")) return; }
            var c = watched || (window.__findCanvas && window.__findCanvas());
            if (c && lost(c)) window.__recover("rendu graphique perdu au retour");
        }
        document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") setTimeout(check, 300); });
        window.addEventListener("pageshow", function (e) { if (e.persisted) setTimeout(check, 300); });
        window.addEventListener("focus", function () { setTimeout(check, 300); });
    })();
</script>
<script>
    // Page blanche : Safari iOS < 18.2 (et d'autres navigateurs anciens) sait lancer WebAssembly mais pas WebAssembly GC, dont l'app a besoin.
    // On le détecte et on le dit clairement ; si le chargement traîne ou plante pour une autre raison, on affiche l'erreur et un bouton.
    (function () {
        var text = document.getElementById("loading-text");
        function show(message, withButton, detail) {
            text.style.maxWidth = "300px";
            text.style.textAlign = "center";
            text.textContent = message;
            if (detail) {
                var d = document.createElement("div");
                d.style.cssText = "max-width:300px;font-size:11px;opacity:.7;word-break:break-word;text-align:center";
                d.textContent = detail;
                text.parentNode.appendChild(d);
            }
            if (withButton) {
                var b = document.createElement("button");
                b.textContent = "Recharger";
                b.style.cssText = "background:#1E88E5;color:#fff;border:0;border-radius:20px;padding:10px 18px;font:600 14px -apple-system,system-ui,sans-serif";
                b.onclick = function () { location.reload(); };
                text.parentNode.appendChild(b);
            }
        }
        var gc = false;
        try { gc = typeof WebAssembly !== "undefined" && WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0])); } catch (e) {}
        if (!gc) {
            window.__noWasmGc = true;
            show("Ce navigateur est trop ancien pour Surf Log (iOS 18.2 ou plus récent requis). Mets à jour iOS, ou utilise un navigateur à jour.", false);
            return;
        }
        var lastError = "";
        window.addEventListener("error", function (e) { lastError = (e && e.message) || lastError; });
        window.addEventListener("unhandledrejection", function (e) { lastError = String((e && e.reason && (e.reason.message || e.reason)) || lastError); });
        // L'app retire #loading en démarrant. Sur un réseau lent (4G faible), le premier téléchargement (environ 5 Mo) peut dépasser
        // 25 secondes : on ne dit plus « n'a pas pu démarrer » tant que ça télécharge, sinon on recharge et le téléchargement repart
        // de zéro (le « chargement infini »). Un téléchargement coupé (réseau perdu) se voit aux erreurs : on recharge une fois tout
        // seul, puis on affiche le message avec le bouton. Reproduit avec le moteur de Safari (28 novembre) : sans ça, l'écran restait
        // sombre et vide, ou bloqué sur « Chargement ».
        text.style.maxWidth = "300px";
        text.style.textAlign = "center";
        function noApp() { return !window.__findCanvas(); }
        var failed = false;
        function fail(reason) {
            if (failed || !noApp()) return;
            failed = true;
            if (window.__diagPush) window.__diagPush("démarrage", reason);
            var retried = false;
            try { retried = Date.now() - Number(sessionStorage.getItem("surflog_boot_retry") || 0) < 120000; } catch (e) {}
            if (!retried && document.visibilityState !== "hidden") {
                try { sessionStorage.setItem("surflog_boot_retry", String(Date.now())); } catch (e) {}
                location.reload();
                return;
            }
            // L'appli a pu retirer l'écran de chargement avant de planter : on le remet pour que le message se voie.
            if (!document.getElementById("loading")) {
                var box = document.createElement("div");
                box.id = "loading";
                box.innerHTML = '<img src="icon-192.png" alt="">';
                box.appendChild(text);
                document.body.appendChild(box);
            }
            show("Surf Log n'a pas pu démarrer : la connexion a coupé pendant le téléchargement. Recharge la page.", true, lastError || reason);
        }
        setTimeout(function () {
            if (document.getElementById("loading") && noApp() && !failed) text.textContent = "Connexion lente : Surf Log se télécharge encore (environ 5 Mo la première fois, ensuite c'est gardé sur le téléphone)…";
        }, 12000);
        setTimeout(function () { fail("rien après 90 s"); }, 90000);
        var removedAt = 0;
        var bootTimer = setInterval(function () {
            if (!noApp()) { clearInterval(bootTimer); return; }
            var errs = window.__diagErrors || [];
            var loadingShown = !!document.getElementById("loading");
            var bad = errs.filter(function (m) {
                return /wasm|CompileError|LinkError|Aborted\(|out of memory/i.test(m) ||
                    (loadingShown && /promesse : .*(Load failed|Failed to fetch|NetworkError)/i.test(m));
            });
            if (bad.length) { clearInterval(bootTimer); fail(bad[0]); return; }
            // L'appli a retiré le chargement mais ne s'affiche toujours pas.
            if (!loadingShown) {
                if (!removedAt) removedAt = Date.now();
                else if (Date.now() - removedAt > 15000) { clearInterval(bootTimer); fail("pas d'affichage 15 s après le démarrage"); }
            }
        }, 1000);
        // Page blanche sans message : l'appli a démarré (un canvas existe) mais n'affiche rien. Pas de WebGL, ou une erreur déjà vue : on montre le diagnostic.
        function webglOk() { try { var c = document.createElement("canvas"); return !!(c.getContext("webgl2") || c.getContext("webgl")); } catch (e) { return false; } }
        if (!webglOk()) { window.addEventListener("DOMContentLoaded", function () { window.__diagShow("Ce navigateur n'offre pas le rendu graphique (WebGL) dont Surf Log a besoin."); }); }
        setTimeout(function () {
            // Seulement les erreurs graphiques ou WebAssembly : une requête réseau en échec ne doit pas couvrir l'appli.
            var grave = (window.__diagErrors || []).filter(function (m) { return /webgl|wasm|webassembly|skia|skiko|RuntimeError|CompileError|LinkError|out of memory/i.test(m); });
            if (grave.length && window.__findCanvas()) window.__diagShow("Surf Log a rencontré une erreur au démarrage.");
        }, 10000);
        // Écran vide : l'appli a retiré le chargement mais ce qu'elle dessine reste d'une seule couleur. diag.js relève un échantillon
        // juste après un dessin (3 relevés au plus, 10 s d'écart ; aucun avec ?nodiag) ; un seul échantillon avec du contenu suffit pour conclure que tout va bien.
        var tries = 0;
        if (window.__noDiag) tries = -1000000;
        var blankTimer = setInterval(function () {
            tries++;
            var sm = window.__samples || [];
            var painted = sm.some(function (x) { return !x.uniform; });
            if (painted) { clearInterval(blankTimer); return; }
            if (tries >= 15) {
                clearInterval(blankTimer);
                // Il faut au moins deux relevés, tous d'une seule couleur, pour conclure à un écran vide. Zéro ou un relevé ne prouve rien :
                // un écran sain qui ne bouge pas ne redessine pas (fausses alertes des versions 1.0.511 et 1.0.512).
                if (sm.length >= 2 && !document.getElementById("loading") && window.__findCanvas()) {
                    window.__diagPush("rendu", sm.length ? "écran uniforme (rgba " + sm[sm.length - 1].color + ") sur " + sm.length + " relevés" : "aucun dessin détecté après le démarrage");
                    // D'abord un rechargement automatique (souvent un rendu perdu en arrière-plan) ; le diagnostic seulement s'il ne suffit pas.
                    if (!window.__recover("écran vide")) window.__diagShow("Surf Log a démarré mais l'écran reste vide.");
                }
            }
        }, 3000);
    })();
</script>
<script>
    // Android (Chrome) : on garde l'invite d'installation pour la déclencher depuis un bouton des Paramètres.
    window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window.__installPrompt = e; });
    window.addEventListener("appinstalled", function () { window.__installPrompt = null; });
    // Mise à jour automatique : le site publie version.json à chaque nouvelle version. Quand on revient
    // sur l'appli et qu'une version plus récente existe, on recharge ; sur un onglet resté ouvert, une
    // bannière propose d'actualiser (on ne coupe pas quelqu'un en pleine saisie).
    (function () {
        var meta = document.querySelector('meta[name=app-version]');
        var current = meta && meta.getAttribute("content");
        if (!current || current === "dev") return;
        function newerVersion() {
            return fetch("version.json?t=" + Date.now(), { cache: "no-store" })
                .then(function (r) { return r.json(); })
                .then(function (d) { return d && d.version && d.version !== current ? d.version : null; })
                .catch(function () { return null; });
        }
        function reloadOnce(version) {
            // Garde-fou : pas de boucle de rechargements pour la même version (un nouvel essai seulement après 5 minutes).
            try {
                var last = JSON.parse(sessionStorage.getItem("surflog_reloaded_for") || "null");
                if (last && last.v === version && Date.now() - last.t < 5 * 60 * 1000) return;
                sessionStorage.setItem("surflog_reloaded_for", JSON.stringify({ v: version, t: Date.now() }));
            } catch (e) {}
            location.reload();
        }
        // On ne coupe jamais quelqu'un en pleine saisie : rechargement seulement si le doigt n'a rien touché depuis 25 secondes
        // et qu'aucune zone de texte n'est active.
        var lastTouch = Date.now();
        ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (ev) {
            window.addEventListener(ev, function () { lastTouch = Date.now(); }, { passive: true, capture: true });
        });
        function typing() {
            var el = document.activeElement;
            return !!el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable);
        }
        function showBanner(version) {
            if (document.getElementById("update-banner")) return;
            var b = document.createElement("div");
            b.id = "update-banner";
            b.textContent = "Nouvelle version disponible · Actualiser";
            b.style.cssText = "position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:99999;" +
                "background:#1E88E5;color:#fff;padding:10px 16px;border-radius:20px;font:600 13px -apple-system,system-ui,sans-serif;" +
                "box-shadow:0 2px 10px rgba(0,0,0,.4);cursor:pointer";
            b.onclick = function () { reloadOnce(version); };
            document.body.appendChild(b);
        }
        // Une version plus récente existe : page cachée ou au repos, on recharge toute seule ; sinon la bannière attend le bon moment.
        function applyUpdate(version) {
            var quiet = document.visibilityState === "hidden" || (Date.now() - lastTouch > 25000 && !typing());
            if (quiet) reloadOnce(version); else showBanner(version);
        }
        function check() { newerVersion().then(function (v) { if (v) applyUpdate(v); }); }
        document.addEventListener("visibilitychange", function () {
            if (document.visibilityState === "visible") newerVersion().then(function (v) { if (v) reloadOnce(v); });
            else check();
        });
        window.addEventListener("pageshow", check);
        window.addEventListener("online", check);
        check();
        setInterval(check, 2 * 60 * 1000);
    })();
    // Zoom : l'appli est dessinée dans un canvas qui garde les gestes pour elle. Quand la page est zoomée (pincement), on
    // rend le geste au navigateur pour qu'un doigt déplace la vue zoomée dans tous les sens ; au zoom normal, rien ne change.
    (function () {
        var vv = window.visualViewport;
        if (!vv) return;
        var style = document.createElement("style");
        style.id = "zoom-pan";
        document.head.appendChild(style);
        var zoomed = false;
        function apply() {
            var now = vv.scale > 1.02;
            if (now === zoomed) return;
            zoomed = now;
            style.textContent = now ? "html, body, canvas { touch-action: auto !important; }" : "";
        }
        vv.addEventListener("resize", apply);
        vv.addEventListener("scroll", apply);
    })();
    // Service worker minimal (aucune mise en cache) : requis par certaines versions de Chrome pour proposer l'installation.
    if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }
</script>
<script src="surflog.js"></script>
</body>
</html>
