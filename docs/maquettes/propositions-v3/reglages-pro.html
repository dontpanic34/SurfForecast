<title>Réglages Surf Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mise en page : cinq écrans de réglages dans un cadre de téléphone (accueil, sources et modèles, affichage, profil, ⚙ d'un encart), choisis par un sélecteur. Style instrument : listes groupées, séparateurs fins, icônes au trait de même épaisseur, chiffres en chasse fixe, aperçu en direct sous chaque réglage. Fond sombre de l'appli, thème clair en alternative. */
:root{
 --bg:#0a1418;--panel:#101e25;--row:#142730;--line:#21404c;--fg:#e9f0f3;--mut:#8ea6b2;--acc:#5fb4dc;--acc-soft:#173b4c;--ok:#34c98a;--warn:#f2b84b;--bad:#ef6a62;
 --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9eff2;--panel:#f7fafb;--row:#ffffff;--line:#d3dfe5;--fg:#10222c;--mut:#566b76;--acc:#0b6a99;--acc-soft:#dcedf5;--ok:#13875a;--warn:#a86d00;--bad:#c4372f;color-scheme:light}}
:root[data-theme="light"]{--bg:#e9eff2;--panel:#f7fafb;--row:#ffffff;--line:#d3dfe5;--fg:#10222c;--mut:#566b76;--acc:#0b6a99;--acc-soft:#dcedf5;--ok:#13875a;--warn:#a86d00;--bad:#c4372f;color-scheme:light}
*{box-sizing:border-box}body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--f-body);padding-inline:16px;padding-block:18px}
main{max-width:430px;margin:0 auto;display:grid;gap:14px}
h1{font:600 1.15rem var(--f-body);margin:0}p{margin:0}.mut{color:var(--mut)}.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.pick{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.pick button{white-space:nowrap}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chip{border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;color:var(--mut)}.chip.on{background:var(--acc-soft);border-color:var(--acc);color:var(--fg)}
.phone{background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden;min-height:640px;display:flex;flex-direction:column}
.bar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:12px 8px 8px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0}
.bar b{text-align:center;font-weight:600;font-size:16px}.bar button{width:44px;height:44px;display:grid;place-items:center;color:var(--acc)}
.body{padding:12px 14px 20px;display:grid;gap:18px;align-content:start}
.sec>h2{font:500 11.5px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:0 4px 6px}
.list{background:var(--row);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:12px 14px;min-height:52px;width:100%;border-top:1px solid var(--line)}.item:first-child{border-top:0}
.item .t{min-width:0}.item .t b{display:block;font-weight:500}.item .t small{display:block;color:var(--mut);font-size:12.5px;line-height:1.35;margin-top:1px}
.item .v{color:var(--mut);font-size:13.5px;display:flex;align-items:center;gap:6px}
.ico{width:22px;height:22px;stroke:var(--acc);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}.seg button{text-align:center;border-radius:8px;padding:8px 6px;font-size:13.5px;color:var(--mut);min-height:36px}.seg button.on{background:var(--acc-soft);color:var(--fg);font-weight:500;box-shadow:inset 0 0 0 1px var(--acc)}
.field{padding:12px 14px;display:grid;gap:10px;border-top:1px solid var(--line)}.field:first-child{border-top:0}.field .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.field .hd b{font-weight:500}.field .hd span{font-family:var(--f-num);font-size:13.5px;color:var(--acc)}
.field small{color:var(--mut);font-size:12.5px;line-height:1.35}
input[type=range]{width:100%;accent-color:var(--acc);height:28px}
.preview{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px}.preview .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}.preview .big{font-family:var(--f-num);font-size:18px}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--fg);transition:transform .15s}.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(18px);background:#fff}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}.radio.on{border-color:var(--acc)}.radio.on::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--acc)}
.help{display:flex;gap:10px;align-items:center;padding:12px 14px;color:var(--acc);font-weight:500;border:1px solid var(--line);border-radius:14px;background:var(--row)}
.search{display:flex;gap:10px;align-items:center;background:var(--row);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:44px;color:var(--mut)}
.badge{font-size:11.5px;border-radius:99px;padding:2px 8px;border:1px solid var(--ok);color:var(--ok)}.badge.w{border-color:var(--warn);color:var(--warn)}
.sheet{margin-top:auto;border-top:1px solid var(--line);border-radius:18px 18px 0 0;background:var(--panel);padding:10px 14px 18px;display:grid;gap:14px}.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.ghost{opacity:.5;padding:14px;border-radius:12px;background:var(--row);border:1px solid var(--line);margin:12px}
.theme{justify-self:end}
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.6-3.6 3.4-5.5 7-5.5s6.4 1.9 7 5.5"/></symbol>
<symbol id="i-board" viewBox="0 0 24 24"><path d="M12 2.5c3 3.2 4 7.5 4 11.5s-1 6-4 7.5c-3-1.5-4-3.5-4-7.5s1-8.3 4-11.5Z"/><path d="M12 5v14"/></symbol>
<symbol id="i-tune" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
<symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></symbol>
<symbol id="i-ruler" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="1.5"/><path d="M7 8v3M11 8v4M15 8v3M19 8v4"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V5M4 20h16"/><path d="m7 15 4-5 3 3 5-6"/></symbol>
<symbol id="i-widget" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
<symbol id="i-save" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5h10a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3V4.5Z"/><path d="M5 17a3 3 0 0 1 3-3h10"/></symbol>
<symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m15.5 8.5-2 5-5 2 2-5 5-2Z"/></symbol>
<symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 3.5 5.5 3.5 8.5S14.500 17.900 12 20.500C9.500 17.900 8.500 15 8.500 12S9.500 6.100 12 3.500Z"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.200 4.200 0 0 1 12 7.600 4.200 4.200 0 0 1 19.500 10c0 5.400-7.500 10-7.500 10Z"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="i-wind" viewBox="0 0 24 24"><path d="M3 9h10a2.500 2.500 0 1 0-2.500-2.500M3 14h14a2.500 2.500 0 1 1-2.500 2.500M3 19h7"/></symbol>
<symbol id="i-wave" viewBox="0 0 24 24"><path d="M2.500 9c2.500-3 4.500-3 7 0s4.500 3 7 0 3.500-2 5 0M2.500 15c2.500-3 4.500-3 7 0s4.500 3 7 0 3.500-2 5 0"/></symbol>
<symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.5-8A5.500 5.500 0 0 1 17 8.500 4.800 4.800 0 0 1 17.500 18H7Z"/></symbol>
<symbol id="i-text" viewBox="0 0 24 24"><path d="M4 18 9 6l5 12M5.800 14h6.400M15 18l3-7 3 7M16 16h4"/></symbol>
</defs></svg>
<main>
<h1>Réglages Surf Log</h1>
<p class="mut" style="font-size:13px">Maquette de la refonte : même grammaire sur tous les écrans (liste groupée, icône au trait, valeur à droite, aide sous le réglage, aperçu en direct). Choisis un écran.</p>
<div class="pick" id="pick" role="tablist"></div>
<div class="phone" id="phone" aria-live="polite"></div>
<button class="chip theme" id="th">Thème clair / sombre</button>
</main>
<script>
function I(n){return '<svg class="ico" aria-hidden="true"><use href="#i-'+n+'"/></svg>'}
var chev='<span class="v">'+I('chev').replace('class="ico"','class="ico" style="stroke:var(--mut);width:18px;height:18px"')+'</span>';
function bar(t,back,close){return '<div class="bar"><button data-go="'+(back||'')+'" aria-label="Retour" '+(back?'':'style="visibility:hidden"')+'>'+I('back')+'</button><b>'+t+'</b><button data-go="home" aria-label="Fermer" '+(close?'':'style="visibility:hidden"')+'>'+I('close')+'</button></div>'}
function item(ic,t,s,v,go){return '<button class="item" data-go="'+(go||'')+'">'+I(ic)+'<span class="t"><b>'+t+'</b>'+(s?'<small>'+s+'</small>':'')+'</span><span class="v">'+(v||'')+(go?I('chev').replace('class="ico"','class="ico" style="stroke:var(--mut);width:18px;height:18px"'):'')+'</span></button>'}
function sec(h,body){return '<div class="sec"><h2>'+h+'</h2><div class="list">'+body+'</div></div>'}
function seg(arr,on,id){return '<div class="seg" data-seg="'+id+'">'+arr.map(function(a,i){return '<button class="'+(i===on?'on':'')+'" data-i="'+i+'">'+a+'</button>'}).join('')+'</div>'}
var S={
home:function(){return bar('Réglages','',true)+'<div class="body"><div class="search">'+I('search')+'<span>Rechercher un réglage</span></div>'
 +sec('Mon surf',item('user','Profil','Ton niveau et ce que tu surfes','Confirmé','profil')+item('board','Matériel','Planches et planche du jour','4 planches','')+item('tune','Tolérance','Vent, clapot et taille qui te gênent','Normal',''))
 +sec('Prévisions',item('layers','Sources et modèles','D’où viennent la houle, le vent et la météo','Auto','modeles')+item('ruler','Unités et affichage','Vent, taille du texte, hauteur des courbes','km/h','affichage'))
 +sec('Application',item('widget','Widget et installation','','')+item('save','Sauvegarde et journal','Prévisions gardées, export','')+item('chart','Fiabilité des prévisions','Prévu contre mesuré, bouée de référence','Bientôt',''))
 +sec('Aide',item('book','Comprendre','Houle, vagues, prévisions','11 leçons','')+item('compass','Visite guidée','','')+item('globe','Langue','','Français',''))
 +'<button class="help" style="justify-content:center">'+I('heart')+'Soutenir Surf Log</button><p class="mut" style="text-align:center;font-size:12px" class="num">Surf Log 1.0.320</p></div>'},
modeles:function(){return bar('Sources et modèles','home')+'<div class="body">'+seg(['Auto (conseillé)','Choisir moi-même'],1,'mode')
 +'<p class="mut" style="font-size:13px">En Auto, l’appli compare plusieurs modèles et te donne une seule valeur. En manuel, tu choisis un modèle par donnée et par échéance.</p>'
 +'<div class="sec"><h2>Houle</h2><div class="list"><div class="field"><div class="hd"><b>Aujourd’hui et demain</b><span>MF-WAM</span></div>'+seg(['MF-WAM','ECMWF','GFS'],0,'w1')+'<div class="preview"><span class="lab">Demain · 14 h</span><span class="big">1,3 m · 9 s</span><small>Météo-France, 8 km. Très bon près de la côte.</small></div></div>'
 +'<div class="field"><div class="hd"><b>Après-demain et suite</b><span>ECMWF</span></div>'+seg(['MF-WAM','ECMWF','GFS'],1,'w2')+'<div class="preview"><span class="lab">J+3 · 14 h</span><span class="big">1,6 m · 11 s</span><small>Modèle global : voit mieux les houles venues de loin. <span class="badge w">Tendance</span></small></div></div></div></div>'
 +'<div class="sec"><h2>Vent</h2><div class="list"><div class="field"><div class="hd"><b>Aujourd’hui et demain</b><span>AROME</span></div>'+seg(['AROME','ARPEGE','ECMWF','GFS'],0,'v1')+'<div class="preview"><span class="lab">Demain · 14 h</span><span class="big">NO 13 km/h</span><small>Météo-France, 1,3 km. Voit les effets de côte.</small></div></div></div></div>'
 +'<div class="sec"><h2>Météo</h2><div class="list"><div class="field"><div class="hd"><b>Ciel, température, pluie</b><span>AROME</span></div>'+seg(['AROME','ARPEGE','ECMWF','GFS'],0,'m1')+'<div class="preview"><span class="lab">Aujourd’hui · 16 h</span><span class="big">Couvert · 19° · 0,7 mm</span><small>Les modèles s’accordent sur le ciel, moins sur l’heure de la bruine. <span class="badge w">Incertain</span></small></div></div></div></div>'
 +'<button class="help">'+I('book')+'Comprendre les modèles<span style="margin-left:auto">'+I('chev')+'</span></button></div>'},
affichage:function(){return bar('Unités et affichage','home')+'<div class="body">'
 +'<div class="sec"><h2>Texte</h2><div class="list"><div class="field"><div class="hd"><b>Taille du texte</b><span>Grand</span></div>'+seg(['Normal','Grand','Très grand'],1,'t')+'</div></div></div>'
 +'<div class="sec"><h2>Vent</h2><div class="list"><div class="field"><div class="hd"><b>Unité</b><span>km/h</span></div>'+seg(['km/h','nœuds','Beaufort'],0,'u')+'<small>Le chiffre affiché est le vent ressenti : vent moyen plus 35 % de l’écart avec les rafales.</small></div></div></div>'
 +'<div class="sec"><h2>Graphiques</h2><div class="list"><div class="field"><div class="hd"><b>Hauteur de l’eau, semaine</b><span id="vw">45 %</span></div><input id="rw" type="range" min="20" max="80" value="45" aria-label="Hauteur de l’eau"><div class="preview"><span class="lab">Aperçu</span><svg viewBox="0 0 300 70" width="100%" role="img" aria-label="Aperçu de la courbe"><rect width="300" height="70" fill="none"/><path id="pw" d="M0 40 C60 30 120 44 180 34 S260 26 300 30 L300 70 L0 70Z" fill="var(--acc-soft)" stroke="var(--acc)" stroke-width="1.5"/></svg></div></div>'
 +'<div class="field"><div class="hd"><b>Hauteur de la courbe de marée</b><span>30 dp</span></div><input type="range" min="24" max="60" value="30" aria-label="Hauteur de la courbe de marée"></div>'
 +'<div class="field" style="grid-template-columns:1fr auto;align-items:center"><div><b style="font-weight:500">Remettre par défaut</b><br><small>Tailles des graphiques de la semaine et du jour</small></div><span class="chip">Réinitialiser</span></div></div></div></div>'},
profil:function(){return bar('Profil','home')+'<div class="body">'
 +'<div class="sec"><h2>Niveau</h2><div class="list">'+[['Débutant','Mousse, petites vagues douces',0],['Intermédiaire','Commence à passer la barre',0],['Confirmé','Autonome, aime un peu de puissance',1],['Avancé','Cherche le creux et la manœuvre',0],['Expert','Pas de limite de taille',0]].map(function(r){return '<button class="item" style="grid-template-columns:1fr auto"><span class="t"><b>'+r[0]+'</b><small>'+r[1]+'</small></span><span class="radio '+(r[2]?'on':'')+'"></span></button>'}).join('')+'</div></div>'
 +'<button class="help">'+I('compass')+'Refaire le questionnaire<span style="margin-left:auto">'+I('chev')+'</span></button>'
 +'<div class="sec"><h2>Tolérance</h2><div class="list"><div class="field"><div class="hd"><b>Quand les conditions sont moyennes</b></div>'+seg(['Flemme','Normal','Motivé'],1,'tol')+'<small>Ne change ni ton niveau ni les étoiles : décale seulement les couleurs.</small></div></div></div></div>'},
encart:function(){return '<div class="ghost mut"><b>Vent</b><br><small>Aujourd’hui, de 8 h à 19 h</small></div><div class="sheet"><div class="grab"></div><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:16px">Réglages du vent</b><button data-go="home" aria-label="Fermer" style="color:var(--acc)">'+I('close')+'</button></div>'
 +'<div class="preview"><span class="lab">Aperçu en direct</span><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center;font-family:var(--f-num);font-size:12px;color:var(--warn)" id="pa"></div></div>'
 +'<div class="list"><div class="field"><div class="hd"><b>Taille des flèches</b><span id="vs">100 %</span></div><input id="rs" type="range" min="60" max="140" value="100" aria-label="Taille des flèches"></div>'
 +'<div class="item" style="grid-template-columns:1fr auto"><span class="t"><b>Afficher les rafales</b><small>Zone grise derrière la courbe</small></span><span class="sw on" data-sw></span></div>'
 +'<div class="item" style="grid-template-columns:1fr auto"><span class="t"><b>Vent ressenti</b><small>Moyen + 35 % de l’écart avec les rafales</small></span><span class="sw on" data-sw></span></div></div>'
 +'<button class="help">'+I('book')+'Comprendre le vent<span style="margin-left:auto">'+I('chev')+'</span></button></div>'}
};
var names={home:'Accueil',modeles:'Sources et modèles',affichage:'Affichage',profil:'Profil',encart:'⚙ d’un encart'};
var cur='home',ph=document.getElementById('phone');
function paint(){ph.innerHTML=S[cur]();document.getElementById('pick').innerHTML=Object.keys(names).map(function(k){return '<button class="chip'+(k===cur?' on':'')+'" data-pick="'+k+'">'+names[k]+'</button>'}).join('');wire()}
function wire(){var r=document.getElementById('rw');if(r)r.addEventListener('input',function(){document.getElementById('vw').textContent=r.value+' %';var y=70-r.value*.8;document.getElementById('pw').setAttribute('d','M0 '+(y+8)+' C60 '+y+' 120 '+(y+12)+' 180 '+(y+4)+' S260 '+(y-6)+' 300 '+y+' L300 70 L0 70Z')});
 var s=document.getElementById('rs');if(s){var pa=document.getElementById('pa');var d=['NO 13','NO 14','ONO 14','NO 16','NO 15'];function f(){pa.innerHTML=d.map(function(x){return '<div><div style="font-size:'+(s.value/100*20)+'px;transform:rotate(135deg);display:inline-block;line-height:1">➤</div><br>'+x+'</div>'}).join('');document.getElementById('vs').textContent=s.value+' %'}s.addEventListener('input',f);f()}}
document.addEventListener('click',function(e){var b=e.target.closest('[data-go]');if(b&&b.dataset.go){cur=b.dataset.go;paint();return}var p=e.target.closest('[data-pick]');if(p){cur=p.dataset.pick;paint();return}var g=e.target.closest('[data-seg] button');if(g){g.parentNode.querySelectorAll('button').forEach(function(x){x.classList.remove('on')});g.classList.add('on');return}var w=e.target.closest('[data-sw]');if(w){w.classList.toggle('on')}});
document.getElementById('th').addEventListener('click',function(){var r=document.documentElement,c=r.getAttribute('data-theme');var dark=c?c==='dark':!matchMedia('(prefers-color-scheme: light)').matches;r.setAttribute('data-theme',dark?'light':'dark')});
paint();
</script>
