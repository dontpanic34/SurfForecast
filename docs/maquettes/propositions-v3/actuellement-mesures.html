<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Actuellement : Mesures</title>
<style>
:root{--bg:#0b1519;--card:#13222a;--t:#e8f0f3;--m:#8fa6af;--ac:#f6c453;--pill:#1c3340}
body{margin:0;background:#06090b;font:15px system-ui,sans-serif;color:var(--t);display:flex;justify-content:center}
.card{width:360px;background:var(--card);border-radius:20px;padding:14px;margin:16px 0}
h3{margin:0 0 4px;font-size:16px}.sub{color:var(--m);font-size:13px;margin-bottom:10px}
.tiles{display:flex;gap:8px}.tile{flex:1;background:var(--pill);border-radius:12px;padding:8px}
.tile b{display:block;font-size:12px;color:var(--m);font-weight:500}
.row{display:flex;align-items:center;gap:8px;margin-top:12px}
.lab{font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:.06em}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--pill);border:1px solid #2a4452;color:var(--t);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.pill.on{border-color:var(--ac);color:var(--ac)}
.detail{margin-top:8px;background:var(--pill);border-radius:12px;padding:9px 12px;font-size:13px;line-height:1.5;display:none}
.detail.show{display:block}.detail span{color:var(--m)}
</style>
<div class="card">
<h3>Actuellement 8 h · Correct</h3><div class="sub">Cette nuit, houle stable…</div>
<div class="tiles"><div class="tile"><b>Houle</b>1,2 m · 9 s</div><div class="tile"><b>Vent</b>7 km/h ESE</div><div class="tile"><b>Marée</b>79 ▼ 13:54</div></div>
<div class="row"><span class="lab">Mesures</span>
<button class="pill" data-d="b"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="3.5" r="1.5"/><path d="M12 5v6M9 11h6l1.5 5h-9zM8 16c0 2 1.5 3 4 3s4-1 4-3M3 21c2 0 2-1 4.5-1S10 21 12 21s2.500-1 4.500-1S19 21 21 21"/></svg> 1,5 m · 10 s</button>
<button class="pill" data-d="s"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V8M8 22h8M12 8l-5-3M12 8l5-3M5 5h4M15 5h4"/><circle cx="12" cy="8" r="1.3"/></svg> 8 km/h E</button></div>
<div class="detail" id="b">Cap Ferret, à 84 km · max 2,6 m · mesuré à 7 h 30</div>
<div class="detail" id="s">Vendays-Montalive, à 3 km · rafales 14 km/h · mesuré à 7 h 00</div>
</div>
<script>
document.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{const on=p.classList.contains('on');
document.querySelectorAll('.pill').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.detail').forEach(x=>x.classList.remove('show'));
if(!on){p.classList.add('on');document.getElementById(p.dataset.d).classList.add('show')}});
</script></html>
