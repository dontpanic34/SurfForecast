<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marée : 10 courbes</title>
<style>
:root{--bg:#0b1519;--card:#13222a;--t:#e8f0f3;--m:#8fa6af}
body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif;padding:14px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.card{background:var(--card);border-radius:14px;padding:8px 10px 6px;width:min(400px,100%)}
h3{margin:2px 2px 4px;font-size:12px;color:var(--m);font-weight:600}
.band{background:linear-gradient(#17394a,#10303f);border-radius:8px}
svg{display:block;width:100%;height:auto}
text{font-family:system-ui,sans-serif}
</style>
<body><div id="app" style="display:contents"></div>
<script>
const W=400,A0=7,A1=20.9,UP='#4A9BF0',DN='#38C976';
const EXT=[[1.383,'BM'],[7.583,'PM'],[13.717,'BM'],[19.933,'PM'],[26.1,'BM']];
let NOW=12.0;const COEF=68;let CHOSEN=new Set();
const X=t=>(t-A0)/(A1-A0)*W;
const fmt=h=>{const H=Math.floor(h)%24,M=Math.round((h-Math.floor(h))*60);return H+':'+String(M).padStart(2,'0')};
function lv(t){for(let i=0;i<EXT.length-1;i++){const [a,ta]=EXT[i],[b]=EXT[i+1];if(t>=a&&t<=b){const f=(t-a)/(b-a),e=(1-Math.cos(Math.PI*f))/2;return ta==='BM'?e:1-e}}return 0}
const rising=t=>{for(let i=0;i<EXT.length-1;i++){const [a]=EXT[i],[b]=EXT[i+1];if(t>=a&&t<=b)return EXT[i][1]==='BM'}return true};
const visibleExt=EXT.filter(e=>e[0]>=A0&&e[0]<=A1);
function pts(y0,h,n=140){let p=[];for(let i=0;i<=n;i++){const t=A0+(A1-A0)*i/n;p.push([X(t),y0-h*lv(t),t])}return p}
const path=p=>'M'+p.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L');
const T=(x,y,s,o={})=>(o.a==='start'||o.a==='end'||(x=Math.min(Math.max(x,24),W-24)),`<text x="${x}" y="${y}" font-size="${o.s||10}" font-weight="${o.w||700}" fill="${o.c||'#fff'}" text-anchor="${o.a||'middle'}" ${o.st?`stroke="#0b1519" stroke-width="2.5" paint-order="stroke"`:''}>${s}</text>`);
const dot=(x,y,r=5)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="#0b1519" stroke-width="1.6"/>`;
const segs=(p,w)=>{let s='',i=0;while(i<p.length-1){const up=rising(p[i][2]+.001);let j=i;while(j<p.length-1&&rising(p[j][2]+.001)===up)j++;s+=`<path d="${path(p.slice(i,j+1))}" fill="none" stroke="${up?UP:DN}" stroke-width="${w}" stroke-linecap="round"/>`;i=j}return s};
const col=up=>up?UP:DN;
const dir=()=>rising(NOW)?'Montant':'Descendant';
const V=[
['1 · Courbe fine, points aux extrêmes, heures dessus/dessous',()=>{const y0=44,h=30,p=pts(y0,h);let s=`<path d="${path(p)}" fill="none" stroke="#9fd3ff" stroke-width="2.4"/>`;
 for(const [t,k] of visibleExt){const y=y0-h*lv(t);s+=`<circle cx="${X(t)}" cy="${y}" r="3.5" fill="${k==='PM'?UP:DN}" stroke="#fff"/>`+T(X(t),k==='PM'?y-7:y+14,fmt(t),{st:1})}
 return [s+dot(X(NOW),y0-h*lv(NOW),5)+T(200,74,dir()+' · coef '+COEF,{c:col(rising(NOW)),s:11,st:1}),82]}],
['2 · Aire sous la courbe : passé foncé, à venir clair',()=>{const y0=48,h=34,p=pts(y0,h);const past=p.filter(q=>q[2]<=NOW),fut=p.filter(q=>q[2]>=NOW);
 let s=`<path d="${path(fut)} L${X(A1)} ${y0} L${X(NOW)} ${y0}Z" fill="rgba(74,155,240,.2)"/><path d="${path(past)} L${X(NOW)} ${y0} L${X(A0)} ${y0}Z" fill="rgba(74,155,240,.6)"/><path d="${path(p)}" fill="none" stroke="#9fd3ff" stroke-width="2"/>`;
 for(const [t,k] of visibleExt){s+=T(X(t),k==='PM'?y0-h*lv(t)-5:y0-4,(k==='PM'?'PM ':'BM ')+fmt(t),{st:1})}
 return [s+dot(X(NOW),y0-h*lv(NOW)),56]}],
['3 · Courbe bicolore (montant bleu / descendant vert) + PM/BM',()=>{const y0=52,h=30,p=pts(y0,h);let s=segs(p,3.4);
 for(const [t,k] of visibleExt){const y=y0-h*lv(t);s+=T(X(t),k==='PM'?y-8:y+15,(k==='PM'?'PM ':'BM ')+fmt(t),{st:1})}
 return [s+dot(X(NOW),y0-h*lv(NOW))+T(200,80,dir()+' · coef '+COEF,{c:col(rising(NOW)),s:11,st:1}),90]}],
['4 · Courbe + « dans 1 h 43 : basse mer » au curseur',()=>{const y0=44,h=28,p=pts(y0,h);let s=`<path d="${path(p)}" fill="none" stroke="#9fd3ff" stroke-width="2.4"/>`;
 const nx=EXT.find(e=>e[0]>NOW),d=nx[0]-NOW,hh=Math.floor(d),mm=Math.round((d-hh)*60);
 const cx=X(NOW),cy=y0-h*lv(NOW);s+=`<line x1="${cx}" x2="${cx}" y1="${cy}" y2="${y0+4}" stroke="#fff" stroke-dasharray="2 3" opacity=".7"/>`+dot(cx,cy);
 for(const [t,k] of visibleExt)s+=`<circle cx="${X(t)}" cy="${y0-h*lv(t)}" r="3" fill="${k==='PM'?UP:DN}" stroke="#fff"/>`;
 return [s+T(cx,y0+17,`${dir()} · ${nx[1]==='BM'?'basse':'pleine'} mer dans ${hh} h ${String(mm).padStart(2,'0')} (${fmt(nx[0])})`,{c:col(rising(NOW)),s:11,st:1}),66]}],
['5 · Courbe épaisse dégradée : bas vert, haut bleu',()=>{const y0=52,h=30,p=pts(y0,h);let s='';for(let i=0;i<p.length-1;i++){const m=lv((p[i][2]+p[i+1][2])/2);s+=`<path d="M${p[i][0]} ${p[i][1]} L${p[i+1][0]} ${p[i+1][1]}" stroke="rgb(${56+(74-56)*m|0},${201+(155-201)*m|0},${118+(240-118)*m|0})" stroke-width="5" stroke-linecap="round" fill="none"/>`}
 for(const [t,k] of visibleExt)s+=T(X(t),k==='PM'?y0-h*lv(t)-8:y0-h*lv(t)+17,fmt(t),{st:1});
 return [s+dot(X(NOW),y0-h*lv(NOW),6)+T(200,82,dir()+' · coef '+COEF,{c:'#fff',s:11,st:1}),92]}],
['6 · Courbe entre deux lignes « pleine mer » et « basse mer »',()=>{const y0=48,h=30,p=pts(y0,h);let s=`<line x1="0" x2="${W}" y1="${y0-h}" y2="${y0-h}" stroke="${UP}" stroke-dasharray="3 4" opacity=".6"/><line x1="0" x2="${W}" y1="${y0}" y2="${y0}" stroke="${DN}" stroke-dasharray="3 4" opacity=".6"/>`+
 T(150,y0-h-3,'PLEINE MER',{a:'start',s:8,c:UP})+T(60,y0+10,'BASSE MER',{a:'start',s:8,c:DN})+`<path d="${path(p)}" fill="none" stroke="#fff" stroke-width="2.4"/>`;
 for(const [t,k] of visibleExt)s+=T(X(t),k==='PM'?y0-h-3:y0+10,fmt(t),{st:1,s:10});
 return [s+dot(X(NOW),y0-h*lv(NOW)),60]}],
['7 · Courbe pleine, mots complets aux extrêmes',()=>{const y0=48,h=28,p=pts(y0,h);let s=`<path d="${path(p)} L${W} ${y0+2} L0 ${y0+2}Z" fill="rgba(74,155,240,.25)"/><path d="${path(p)}" fill="none" stroke="#9fd3ff" stroke-width="2.2"/>`;
 for(const [t,k] of visibleExt)s+=T(X(t),k==='PM'?y0-h*lv(t)-5:y0-6,(k==='PM'?'Pleine ':'Basse ')+fmt(t),{st:1,s:9.5});
 return [s+dot(X(NOW),y0-h*lv(NOW))+T(200,74,dir()+' · coef '+COEF,{c:col(rising(NOW)),s:11,st:1}),82]}],
['8 · Courbe + curseur vertical + niveau en %',()=>{const y0=44,h=30,p=pts(y0,h);const lvl=Math.round(lv(NOW)*100);let s=`<path d="${path(p)}" fill="none" stroke="#9fd3ff" stroke-width="2.4"/>`;
 const cx=X(NOW),cy=y0-h*lv(NOW);s+=`<line x1="${cx}" x2="${cx}" y1="6" y2="${y0+2}" stroke="#fff" opacity=".55"/>`+dot(cx,cy)+T(cx+(cx>300?-8:8),14,`${lvl} % · ${dir().toLowerCase()}`.replace(/^./,c=>c.toUpperCase()),{a:cx>300?'end':'start',s:10,st:1,c:col(rising(NOW))});
 for(const [t,k] of visibleExt)s+=`<circle cx="${X(t)}" cy="${y0-h*lv(t)}" r="3" fill="${k==='PM'?UP:DN}" stroke="#fff"/>`+T(X(t),y0+15,(k==='PM'?'PM ':'BM ')+fmt(t),{st:1,s:9.5});
 return [s,64]}],
['9 · Courbe bicolore + bande de couleur dessous',()=>{const y0=40,h=28,p=pts(y0,h);let s=`<path d="${path(p)}" fill="none" stroke="#dfeaf2" stroke-width="2.4"/>`;
 for(let i=0;i<p.length-1;i++){const up=rising(p[i][2]+.001);s+=`<rect x="${p[i][0]}" y="${y0+6}" width="${p[i+1][0]-p[i][0]+.6}" height="5" fill="${col(up)}"/>`}
 for(const [t,k] of visibleExt)s+=`<circle cx="${X(t)}" cy="${y0-h*lv(t)}" r="3" fill="#fff"/>`+T(X(t),y0+23,(k==='PM'?'PM ':'BM ')+fmt(t),{st:1,s:9.5});
 return [s+dot(X(NOW),y0-h*lv(NOW))+T(200,y0+38,dir()+' · coef '+COEF,{c:col(rising(NOW)),s:11,st:1}),84]}],
['10 · Courbe lissée haute lisibilité (grand point + flèche courte)',()=>{const y0=52,h=32,p=pts(y0,h);let s=`<path d="${path(p)} L${W} ${y0+3} L0 ${y0+3}Z" fill="rgba(143,166,175,.18)"/>`+segs(p,3);
 const cx=X(NOW),cy=y0-h*lv(NOW),up=rising(NOW);s+=`<circle cx="${cx}" cy="${cy}" r="8" fill="${col(up)}" opacity=".35"/>`+dot(cx,cy,5)+`<path d="M${cx+9} ${cy+(up?3:-3)} l7 ${up?-7:7}" stroke="${col(up)}" stroke-width="3" stroke-linecap="round" fill="none"/>`;
 for(const [t,k] of visibleExt)s+=T(X(t),k==='PM'?y0-h*lv(t)-6:y0-h*lv(t)+16,fmt(t)+(k==='PM'?'':''),{st:1,s:10});
 return [s+T(200,84,dir()+' · coef '+COEF,{c:col(up),s:11,st:1}),92]}]
];
function draw(){let html='<div class="card" style="width:min(400px,100%);text-align:center"><b id="pick">Touche une carte pour la choisir · glisse le doigt sur une courbe pour changer l\'heure</b></div>';
V.forEach(([n,f],i)=>{const [body,H]=f();const on=CHOSEN.has(i);html+=`<div class="card" data-i="${i}" style="${on?'outline:2px solid #f6c453':''}"><h3>${on?'✓ ':''}${n}</h3><div class="band" data-band="1"><svg viewBox="0 0 ${W} ${H}">${body}</svg></div></div>`});
document.getElementById('app').innerHTML=html;
document.getElementById('pick').textContent=CHOSEN.size?('Ton choix : '+[...CHOSEN].map(i=>i+1).sort((a,b)=>a-b).join(' + ')+' · il est '+fmt(NOW)):('Touche une carte pour la choisir · glisse sur une courbe pour changer l\'heure (il est '+fmt(NOW)+')');
document.querySelectorAll('.card[data-i]').forEach(c=>c.onclick=e=>{if(e.target.closest('[data-band]')&&e.detail===0)return;const i=+c.dataset.i;CHOSEN.has(i)?CHOSEN.delete(i):CHOSEN.add(i);draw()});
document.querySelectorAll('[data-band]').forEach(el=>{const mv=e=>{const r=el.getBoundingClientRect();NOW=A0+Math.min(Math.max((e.clientX-r.left)/r.width,0),1)*(A1-A0);draw2()};
 el.addEventListener('pointerdown',e=>{el.setPointerCapture&&0;el._d=true;mv(e)});el.addEventListener('pointermove',e=>{if(el._d)mv(e)});el.addEventListener('pointerup',()=>{el._d=false});el.style.touchAction='none'})}
function draw2(){ // met à jour les courbes sans recréer les cartes (le glissement reste fluide)
 document.querySelectorAll('.card[data-i]').forEach(c=>{const i=+c.dataset.i;const [body,H]=V[i][1]();c.querySelector('svg').innerHTML=body});
 const p=document.getElementById('pick');p.textContent=(CHOSEN.size?'Ton choix : '+[...CHOSEN].map(i=>i+1).sort((a,b)=>a-b).join(' + ')+' · ':'')+'il est '+fmt(NOW)}
draw();
</script></html>
