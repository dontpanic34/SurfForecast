<title>Comprendre la houle</title>
<style>
/* Mise en page : la future section « Comprendre » de l'appli. Un accueil à trois chapitres, des leçons courtes (une idée, un exemple, à retenir, ce que fait l'appli) et trois petits outils à manipuler (énergie, arrivée de la houle, profondeur de déferlement). Fond sombre de l'appli. */
:root{--bg:#0b1519;--card:#14262f;--tile:#1b333d;--fg:#ecf0f1;--mut:#90a4ae;--link:#7fc3e6;--sel:#2c5a70;--g:#2bd47a;--y:#ffd21f;color-scheme:dark}
*{box-sizing:border-box}body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;font-size:15px;line-height:1.45;padding:16px}
main{max-width:470px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
h1{font-size:1.25rem;margin:0}h2{font-size:1.05rem;margin:0}h3{font-size:.95rem;margin:0;color:var(--link)}p{margin:0}.mut{color:var(--mut)}.sm{font-size:12.5px}
.card{background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
button{font:inherit;color:var(--fg);border:0;background:none;cursor:pointer;text-align:left}
.ch{background:var(--card);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;width:100%}.ch:focus-visible,.ls:focus-visible,.back:focus-visible{outline:2px solid var(--link)}
.ch .ic{font-size:26px}.ch b{display:block;font-size:16px}.ch small{color:var(--mut)}
.ls{background:var(--tile);border-radius:12px;padding:12px;display:flex;justify-content:space-between;width:100%;gap:8px}.ls span{color:var(--mut)}
.back{color:var(--link);font-weight:700;padding:4px 0}
.take{background:#0f2a22;border-left:4px solid var(--g);border-radius:8px;padding:8px 10px}.app{background:var(--tile);border-radius:8px;padding:8px 10px;color:#cfe3ee}
.tool{background:#0f1d24;border-radius:12px;padding:10px;display:grid;gap:6px}
label{display:flex;justify-content:space-between;font-size:13px;gap:8px}input[type=range]{width:100%;accent-color:#5aa6cc}
.big{font-size:22px;font-weight:800}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{height:10px;border-radius:5px;background:#2a4350;overflow:hidden}.bar i{display:block;height:100%;background:#4fc3f7}
.phone{background:#0b1217;border:1px solid #243846;border-radius:16px;padding:10px;display:grid;gap:8px}
.chip{display:inline-block;background:var(--sel);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}
</style>
<main id="app"></main>
<script>
var CH=[
{ic:'🌊',t:'La houle',s:'Période, séries, arrivée',l:[
 {t:'Houle et vague, pas la même chose',b:'La <b>houle</b> voyage : elle transporte de l’énergie à travers l’océan. La <b>vague</b> est ce qui arrive quand cette énergie se dépense, en touchant le fond près de la côte.',k:'On prévoit la houle, on surfe la vague.'},
 {t:'La période, la vraie puissance',b:'Deux houles de même hauteur ne se valent pas : la période compte <b>au carré</b>. Une houle de 1,5 m à 8 s libère environ 283 kJ ; une houle de 1 m à 14 s environ 385 kJ, donc plus, alors qu’elle est plus petite. Règle de poche : chaque seconde en plus, environ +20 % d’énergie.',k:'Une petite houle longue peut valoir mieux qu’une grosse houle courte.',a:'Les kJ affichés tiennent déjà compte de la période.',tool:'energy'},
 {t:'Hauteur significative et séries',b:'La hauteur annoncée est la moyenne du <b>tiers des plus grosses vagues</b>. Les séries montent plus haut, environ un tiers de plus : 0,9 m annoncé veut dire des séries vers 1,2 m. Des houles de périodes presque identiques s’additionnent : parfois elles se renforcent, parfois elles s’annulent. C’est ce qui fait les séries.',k:'Le chiffre est une moyenne, pas un maximum.'},
 {t:'Quand arrive la houle ?',b:'Une houle voyage à environ <b>0,75 × sa période</b> en mètres par seconde. Si la dépression est un peu plus petite, la période baisse : la houle arrive plus tard et plus petite.',k:'Au-delà de trois jours, l’heure d’arrivée est une plage, pas un horaire.',a:'Les prévisions lointaines peuvent glisser d’une demi-journée.',tool:'arrival'},
 {t:'Les vagues vont plus vite que la houle',b:'Dans un train de houle, chaque vague avance <b>deux fois plus vite</b> que le train : elle remonte vers l’avant puis disparaît, comme la chenille d’un tank. (Vrai au large, pas près de la côte.)',k:'La houle arrive d’un bloc, ses vagues défilent dedans.'}]},
{ic:'🏄',t:'La vague et le spot',s:'Fond, bancs de sable, énergie',l:[
 {t:'Quand la houle devient vague',b:'Près de la côte, le fond freine la houle, l’eau s’empile et finit par tomber : elle gonfle sans casser, s’effondre ou plonge (le tube). Deux choses décident : la <b>période</b> et la <b>pente du fond</b>. Une vague casse dans une profondeur d’environ 1,3 fois sa hauteur. Le vent de terre, un courant d’embouchure ou de baïne aident au tube.',k:'Le même ciel donne des vagues très différentes selon le fond du spot.',tool:'break'},
 {t:'Bancs de sable et baïnes',b:'Sur un fond de sable, la marée qui descend cherche une sortie et creuse un sillon : la baïne. Elle s’approfondit à chaque marée, puis s’élargit jusqu’à ce qu’une autre se forme à côté. Le <b>banc</b> compte : une marche nette donne un pic bien formé. Un banc vit quelques semaines.',k:'Un spot de sable change d’une semaine à l’autre.',a:'Ton journal de sessions est le meilleur moyen de le suivre.'},
 {t:'Lire l’énergie (les kJ)',b:'Les modèles décrivent la houle en plein de morceaux. L’<b>énergie</b> les additionne en un seul chiffre : elle compare deux houles qui font « 1,8 m à 10 s » sur le papier. L’<b>étalement directionnel</b> dit si la houle est rangée (petit) ou en chantier (grand). Débutant : la taille. Intermédiaire : ajoute la période. Expert : l’énergie. Un spot commence par exemple à marcher vers 250 kJ et sature vers 600 kJ.',k:'Un chiffre d’énergie vaut mieux que hauteur et période pris séparément.'}]},
{ic:'🛰️',t:'Les prévisions',s:'Modèles, cartes, bouées',l:[
 {t:'Pourquoi les prévisions se trompent',b:'Un modèle découpe la mer en carrés. Il ne voit que ce qui est <b>5 à 7 fois plus grand</b> que son carré : à 25 km il oublie les îles ; à 5 km il voit encore mal la côte. Les modèles <b>fins</b> sont meilleurs près du trait de côte ; les modèles <b>globaux</b> meilleurs pour les grandes houles venues de loin.',k:'Côte : un modèle fin. Grosse houle qui arrive : un modèle global.',a:'Modèles fins pour aujourd’hui et demain, globaux ensuite.'},
 {t:'Lire une carte',b:'1. Repère les <b>dépressions</b> : le vent tourne autour, d’autant plus fort que les isobares sont serrées. 2. Regarde la <b>carte de la période</b> plutôt que celle des hauteurs. 3. Puis le vent sur ton secteur. 4. Seulement ensuite, ton site de prévision pour le spot.',k:'Houle d’abord, vent ensuite, détail du spot en dernier.'},
 {t:'Vérifier avec la bouée',b:'Une <b>bouée</b> mesure la houle pour de vrai. Si elle voit 1,3 m et la prévision 0,8 m, la prévision est trop basse sur ce secteur. Son spectre montre si la houle est rangée ou mélangée.',k:'La bouée est la vérité du moment, la prévision est une hypothèse.'}]}
];
var st={c:null,l:null},app=document.getElementById('app');
function el(h){return h}
function home(){
 app.innerHTML='<h1>Comprendre</h1><p class="mut sm">Maquette de la future section de l’appli. Touche un chapitre, puis une leçon. Trois leçons ont un petit outil à manipuler.</p>'+CH.map(function(c,i){return '<button class="ch" data-c="'+i+'"><span class="ic">'+c.ic+'</span><span><b>'+c.t+'</b><small>'+c.s+' · '+c.l.length+' leçons</small></span></button>'}).join('')+'<button class="ch" disabled style="opacity:.55"><span class="ic">⛅</span><span><b>La météo</b><small>Bientôt</small></span></button>'
 +'<div class="card"><h3>Où on y accède dans l’appli</h3><div class="phone"><div class="sm mut">Accueil, sous le résumé de la semaine</div><div class="ch" style="padding:10px"><span class="ic">📘</span><span><b style="font-size:14px">Comprendre la houle ›</b><small>11 leçons courtes</small></span></div><div class="sm mut">Dans le ⚙ de chaque encart</div><div><span class="chip">La période, la vraie puissance ›</span></div><div class="sm mut">Dans Réglages</div><div><span class="chip">Comprendre</span></div></div><p class="sm mut">Trois portes : une carte sur l’accueil, un lien vers la bonne leçon dans le « Comprendre » du ⚙ de chaque encart, et une entrée dans Réglages.</p></div>';
}
function chapter(i){var c=CH[i];app.innerHTML='<button class="back" data-b="home">‹ Comprendre</button><h1>'+c.ic+' '+c.t+'</h1>'+c.l.map(function(l,j){return '<button class="ls" data-c="'+i+'" data-l="'+j+'"><b>'+l.t+'</b><span>›</span></button>'}).join('')}
function lesson(i,j){var l=CH[i].l[j];app.innerHTML='<button class="back" data-b="'+i+'">‹ '+CH[i].t+'</button><div class="card"><h2>'+l.t+'</h2><p>'+l.b+'</p>'+(l.tool?'<div class="tool" id="tool"></div>':'')+'<div class="take"><b>À retenir</b><br>'+l.k+'</div>'+(l.a?'<div class="app"><b>Dans Surf Log</b><br>'+l.a+'</div>':'')+'</div><div class="row2">'+(j>0?'<button class="ls" data-c="'+i+'" data-l="'+(j-1)+'">‹ Précédente</button>':'<span></span>')+(j<CH[i].l.length-1?'<button class="ls" data-c="'+i+'" data-l="'+(j+1)+'">Suivante ›</button>':'<span></span>')+'</div>';if(l.tool)tools[l.tool]()}
var tools={
energy:function(){var t=document.getElementById('tool');t.innerHTML='<label>Houle A : hauteur <b id="ah"></b></label><input id="ahr" type="range" min="3" max="30" value="15"><label>Houle A : période <b id="ap"></b></label><input id="apr" type="range" min="5" max="20" value="8"><label>Houle B : hauteur <b id="bh"></b></label><input id="bhr" type="range" min="3" max="30" value="10"><label>Houle B : période <b id="bp"></b></label><input id="bpr" type="range" min="5" max="20" value="14"><div class="row2"><div><div class="sm mut">A</div><div class="big" id="ae"></div><div class="bar"><i id="ab"></i></div></div><div><div class="sm mut">B</div><div class="big" id="be"></div><div class="bar"><i id="bb"></i></div></div></div><p id="cmp" class="sm"></p>';
 function u(){var ah=+ahr.value/10,ap=+apr.value,bh=+bhr.value/10,bp=+bpr.value,ae=1.962*ah*ah*ap*ap,be=1.962*bh*bh*bp*bp;ah_.textContent=ah.toFixed(1).replace('.',',')+' m';ap_.textContent=ap+' s';bh_.textContent=bh.toFixed(1).replace('.',',')+' m';bp_.textContent=bp+' s';ae_.textContent=Math.round(ae)+' kJ';be_.textContent=Math.round(be)+' kJ';var m=Math.max(ae,be);ab.style.width=ae/m*100+'%';bb.style.width=be/m*100+'%';var r=(be/ae-1)*100;cmp.textContent=Math.abs(r)<3?'À peu près la même énergie.':'La houle '+(r>0?'B':'A')+' a '+Math.round(Math.abs(r)/ (r>0?1:1))+' % de plus d’énergie que l’autre.'}
 var ah_=document.getElementById('ah'),ap_=document.getElementById('ap'),bh_=document.getElementById('bh'),bp_=document.getElementById('bp'),ae_=document.getElementById('ae'),be_=document.getElementById('be'),ahr=document.getElementById('ahr'),apr=document.getElementById('apr'),bhr=document.getElementById('bhr'),bpr=document.getElementById('bpr'),ab=document.getElementById('ab'),bb=document.getElementById('bb'),cmp=document.getElementById('cmp');
 t.querySelectorAll('input').forEach(function(i){i.addEventListener('input',u)});u()},
arrival:function(){var t=document.getElementById('tool');t.innerHTML='<label>Distance de la tempête <b id="d"></b></label><input id="dr" type="range" min="500" max="4000" step="100" value="1800"><label>Période de la houle <b id="p"></b></label><input id="pr" type="range" min="8" max="20" value="14"><div class="big" id="res"></div><p class="sm mut" id="res2"></p>';
 var dr=document.getElementById('dr'),pr=document.getElementById('pr');function u(){var d=+dr.value,p=+pr.value,v=0.75*p,h=d*1000/v/3600,h2=d*1000/(0.75*10)/3600;document.getElementById('d').textContent=d+' km';document.getElementById('p').textContent=p+' s';document.getElementById('res').textContent='Arrive dans environ '+Math.round(h)+' h';document.getElementById('res2').textContent='Vitesse : '+Math.round(v*3.6)+' km/h. Pour comparer, une houle de 10 s mettrait '+Math.round(h2)+' h : '+(Math.round(h2-h)>0?Math.round(h2-h)+' h de plus.':'autant de temps.')}
 dr.addEventListener('input',u);pr.addEventListener('input',u);u()},
break:function(){var t=document.getElementById('tool');t.innerHTML='<label>Hauteur de la vague <b id="h"></b></label><input id="hr" type="range" min="3" max="40" value="15"><div class="big" id="res"></div><p class="sm mut">Elle casse quand la profondeur vaut environ 1,3 fois sa hauteur.</p>';var hr=document.getElementById('hr');function u(){var h=+hr.value/10;document.getElementById('h').textContent=h.toFixed(1).replace('.',',')+' m';document.getElementById('res').textContent='Casse vers '+(h*1.3).toFixed(2).replace('.',',')+' m de profondeur'}hr.addEventListener('input',u);u()}};
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.b){b.dataset.b==='home'?home():chapter(+b.dataset.b);window.scrollTo(0,0);return}if(b.dataset.l!=null&&b.dataset.l!==''){lesson(+b.dataset.c,+b.dataset.l);window.scrollTo(0,0);return}if(b.dataset.c!=null&&b.dataset.c!==''){chapter(+b.dataset.c);window.scrollTo(0,0)}});
home();
</script>
