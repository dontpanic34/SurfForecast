<title>Modèles de prévision</title>
<style>
/* Mise en page : réglage des sources, version légère, sans graphique. Une ligne par modèle avec trois ou quatre valeurs (matin, midi, soir, ou un jour par colonne) ; on touche une ligne pour la choisir, une phrase dit ce que ça change. Vraies prévisions d'aujourd'hui pour Montalivet. Fond sombre de l'appli. */
:root{--bg:#0b1519;--card:#14262f;--tile:#1b333d;--fg:#ecf0f1;--mut:#90a4ae;--link:#7fc3e6;--sel:#2c5a70;--y:#ffd21f;--o:#ff9a1f;--r:#ff5a55;color-scheme:dark}

main{max-width:470px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
h1{font-size:1.25rem;margin:0}h2{font-size:1rem;margin:0;color:var(--link)}p{margin:0}.mut{color:var(--mut)}.sm{font-size:12px}

.seg{display:flex;background:var(--tile);border-radius:99px;padding:3px}.seg button{flex:1}

.row{width:100%;background:var(--tile);border-radius:10px;padding:8px;text-align:center;border:2px solid transparent;cursor:pointer;color:var(--fg);font:inherit}
.row.on{border-color:#5aa6cc;background:var(--sel)}.row .nm{text-align:left;font-weight:700;font-size:13px}.row .nm small{display:block;font-weight:400;color:var(--mut);font-size:10.5px}

.sum{background:#0f1d24;border-radius:10px;padding:8px 10px;font-size:13px}
