<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Journal de session : maquette interactive</title>
<style>
:root{--bg:#0d1b24;--card:#142832;--fg:#e8eef2;--mut:#8da2ad;--acc:#7cc0e8;--line:#27414f;--tile:#1a313d;--segbg:#101f28;--segon:#2b6d8f;--night:#27394a;color-scheme:dark}
:root[data-theme="light"]{--bg:#cfdbe6;--card:#dce6ee;--fg:#10222e;--mut:#5a6f7b;--acc:#124e6e;--line:#b9c9d4;--tile:#c5d3de;--segbg:#c3d1dc;--segon:#124e6e;--night:#aab8d2;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;margin:0;padding:14px}
main{max-width:430px;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.bar h1{font-size:16px;margin:0}
.opt{font-size:12.5px;color:var(--mut);display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.opt label{display:flex;gap:5px;align-items:center}.opt button{background:var(--tile);color:var(--fg);border:0;border-radius:8px;padding:5px 10px;font:inherit}
.app{background:var(--card);border-radius:14px;padding:10px 12px}.hd{display:flex;justify-content:space-between;font-weight:800;margin-bottom:0;font-size:14.5px}.hd span{color:var(--mut);font-weight:400}
.lab{font-size:11px;font-weight:700;color:var(--mut);margin:9px 0 4px;display:flex;justify-content:space-between}.lab b{color:var(--fg);font-size:13px}
.ruler{display:flex;gap:3px;touch-action:none;user-select:none}.cell{flex:1;height:20px;border-radius:6px;background:var(--tile);position:relative;cursor:pointer}
.cell.day{background:linear-gradient(#e0b45a,#c9963a)}.cell.dim{background:#8a7640;opacity:.7}.cell.hatch{background:repeating-linear-gradient(45deg,var(--night),var(--night) 3px,#3a4d63 3px,#3a4d63 6px)}
.cell.in{outline:2px solid #fff;outline-offset:1px;filter:brightness(1.2)}.cell.st:after{content:"";position:absolute;left:-2px;top:-5px;bottom:-5px;width:3px;background:#fff;border-radius:2px}
.sun{display:flex;justify-content:space-between;font-size:11px;color:#d29a3a;margin-top:4px;min-height:14px}
.seg{display:flex;background:var(--segbg);border-radius:10px;padding:2px;gap:2px}.seg span{flex:1;text-align:center;font-size:12.5px;padding:5px 3px;border-radius:9px;color:var(--mut);cursor:pointer;white-space:nowrap}.seg span.on{background:var(--segon);color:#fff;font-weight:700}.seg span.add{color:var(--acc);font-weight:700}
input[type=range]{width:100%;accent-color:var(--acc);margin:2px 0 0;height:20px}
.sum{text-align:center;font-size:12px;color:var(--mut);margin-top:0}.sum b{color:var(--fg)}
.bands{display:flex;flex-wrap:wrap;gap:5px}.bands span{padding:5px 10px;border-radius:50px;font-size:12.5px;font-weight:700;cursor:pointer;background:var(--tile);color:var(--mut);border:2px solid transparent}.bands span.on{border-color:#fff}.lab em{font-style:normal;font-weight:600;font-size:11.5px;color:var(--acc)}textarea.txt{resize:none;margin-top:6px;padding:7px 10px;font-size:13px}
.btn{background:var(--segon);color:#fff;border-radius:11px;text-align:center;padding:10px;font-weight:800;margin-top:10px;cursor:pointer}
.txt{width:100%;background:var(--tile);border:0;border-radius:10px;padding:9px 11px;color:var(--fg);font:inherit;margin-top:6px}
.toast{display:none;margin-top:10px;background:#2c7a4f;color:#fff;border-radius:10px;padding:9px;text-align:center;font-size:13px}
</style><main>
<div class="bar"><h1>Nouvelle session · maquette à toucher</h1></div>
<div class="opt"><button id="theme">Thème clair / sombre</button></div>
<div class="app" id="app">
 <div class="hd"><span style="color:var(--fg);font-weight:800">Session · Montalivet</span><span>✕</span></div>
 <div class="lab"><span>JOUR</span></div>
 <div class="seg" id="day"></div>
 <div class="lab"><span>DÉBUT</span><b id="startLbl"></b></div>
 <div class="ruler" id="ruler"></div>
 <div class="lab"><span>DURÉE</span><b id="durLbl"></b></div>
 <input type="range" id="dur" min="20" max="300" step="20" value="80">
 <div class="sum" id="sum"></div>
 <div class="lab"><span>PLANCHE</span></div>
 <div class="seg" id="boards"></div>
 <div id="newBoard" style="display:none"><input class="txt" id="nb" placeholder="Nom de la planche (ajoutée à Mon matériel)"></div>
 <div class="lab"><span>COMMENT C’ÉTAIT ?</span><em id="hint"></em></div>
 <div class="bands" id="bands"></div>
 <textarea class="txt" id="note" rows="1" placeholder="Une note perso (facultatif) : le pic, la foule, le feeling…"></textarea>
 <div class="btn" id="save">Enregistrer</div>
 <div class="toast" id="toast"></div>
</div></main>
<script>
const $=id=>document.getElementById(id);
const SUNRISE=8.28, SUNSET=19.37; // 8 h 17, 19 h 22
const BANDS=[['Mauvais','#9B1C31','#fff'],['Médiocre','#E53935','#fff'],['Correct','#FFD21F','#061018'],['Bon','#1A9C82','#fff'],['Très bon','#2BD47A','#061018'],['Parfait','#0F8A52','#fff'],['Challengeant','#FF9A1F','#061018']];
const st={day:2,hour:8,min:0,dur:80,band:3,board:0,boards:['Xero','Grace']};
const fmt=m=>{const h=Math.floor(m/60),mm=m%60;return h+' h '+String(mm).padStart(2,'0')};
const dur=m=>{const h=Math.floor(m/60),mm=m%60;return (h?h+' h ':'')+(mm?String(mm).padStart(h?2:1,'0')+(h?'':' min'):'')||'0'};
// cases : nuit par blocs de 3 h, jour heure par heure (lever-2 h ... coucher+2 h)
const low=Math.floor(SUNRISE)-2,high=Math.ceil(SUNSET)+2;
const cells=[];let h=0;while(h<low){cells.push({a:h,b:Math.min(h+2,low-1),block:true});h+=3}
for(;h<=high&&h<24;h++)cells.push({a:h,b:h,block:false});
while(h<24){cells.push({a:h,b:Math.min(h+2,23),block:true});h+=3}
function draw(){
 const start=st.hour*60+st.min;
 const maxDur=Math.min(300,1440-start);if(st.dur>maxDur)st.dur=Math.max(20,Math.floor(maxDur/20)*20);
 $('dur').max=Math.max(20,Math.floor(Math.min(300,1440-start)/20)*20);$('dur').value=st.dur;
 const end=start+st.dur;
 $('ruler').innerHTML='';
 cells.forEach(c=>{const d=document.createElement('div');let cls='cell';
  if(c.block)cls+=' hatch';else if(c.a>=SUNRISE-0.5&&c.a<SUNSET+0.5)cls+=' day';else cls+=' dim';
  const cs=c.a*60,ce=(c.b+1)*60;if(start<ce&&end>cs)cls+=' in';
  if(start>=cs&&start<ce)cls+=' st';
  d.className=cls;d.onpointerdown=e=>{pick(c);try{d.setPointerCapture(e.pointerId)}catch(_){}};d.dataset.i=cells.indexOf(c);$('ruler').appendChild(d)});
 $('startLbl').textContent=fmt(start);$('durLbl').textContent=dur(st.dur);
 $('sum').innerHTML='de <b>'+fmt(start)+'</b> à <b>'+fmt(Math.min(end,1440))+'</b>';
 $('day').innerHTML='';['Avant-hier','Hier','Aujourd’hui'].forEach((t,i)=>{const s=document.createElement('span');s.textContent=t;if(i==st.day)s.className='on';s.onclick=()=>{st.day=i;draw()};$('day').appendChild(s)});
 $('boards').innerHTML='';st.boards.forEach((b,i)=>{const s=document.createElement('span');s.textContent=b;if(i==st.board)s.className='on';s.onclick=()=>{st.board=i;$('newBoard').style.display='none';draw()};$('boards').appendChild(s)});
 const a=document.createElement('span');a.className='add';a.textContent='+ Planche';a.onclick=()=>{$('newBoard').style.display='block';$('nb').focus()};$('boards').appendChild(a);
 $('bands').innerHTML='';BANDS.forEach((b,i)=>{const e=document.createElement('span');e.textContent=b[0];if(i==st.band){e.className='on';e.style.background=b[1];e.style.color=b[2]}else{e.style.borderColor=b[1]+'66'}e.onclick=()=>{st.band=i;draw()};$('bands').appendChild(e)});$('hint').textContent='La prévision était : Bon';
}
function pick(c){st.hour=c.block?Math.floor((c.a+c.b)/2):c.a;draw()}
// glisser sur la barre pour choisir le début
$('ruler').addEventListener('pointermove',e=>{if(e.buttons!==1)return;const r=$('ruler').getBoundingClientRect();const i=Math.min(cells.length-1,Math.max(0,Math.floor((e.clientX-r.left)/r.width*cells.length)));pick(cells[i])});
$('dur').oninput=e=>{st.dur=+e.target.value;draw()};
$('theme').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='light'?'dark':'light'};
$('nb').addEventListener('keydown',e=>{if(e.key==='Enter'&&$('nb').value.trim()){st.boards.push($('nb').value.trim());st.board=st.boards.length-1;$('nb').value='';$('newBoard').style.display='none';draw()}});
$('save').onclick=()=>{const start=st.hour*60+st.min;$('toast').style.display='block';$('toast').textContent='Session enregistrée : '+['avant-hier','hier','aujourd’hui'][st.day]+', '+fmt(start)+' → '+fmt(Math.min(start+st.dur,1440))+' · '+st.boards[st.board]+' · '+(st.band>=0?BANDS[st.band][0]:'sans avis')+($('note').value?' · « '+$('note').value+' »':'')};
if(matchMedia('(prefers-color-scheme: light)').matches)document.documentElement.dataset.theme='light';
draw();
</script></html>
