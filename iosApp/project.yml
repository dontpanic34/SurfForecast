# Projet Xcode généré par XcodeGen (`xcodegen generate` dans ce dossier) plutôt que
# versionné tel quel : un .pbxproj écrit à la main est illisible et casse facilement.
name: SurfLog
options:
  bundleIdPrefix: com.surfcast
  deploymentTarget:
    iOS: "16.0"
targets:
  SurfLog:
    type: application
    platform: iOS
    sources: [SurfLog]
    info:
      path: SurfLog/Info.plist
      properties:
        CFBundleDisplayName: Surf Log
        # Version affichée sur l'accueil : 1.0.<n° du build GitHub> (passé par la CI).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Requis par Compose Multiplatform (sinon plantage au lancement) : autorise 120 Hz.
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.surfcast.surflog
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        # Framework Kotlin statique produit par `./gradlew :shared:linkDebugFrameworkIosSimulatorArm64`.
        # Simulateur uniquement pour l'instant (pas de build appareil sans compte Apple Developer).
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework
        OTHER_LDFLAGS: ["-framework", "SharedCore"]
