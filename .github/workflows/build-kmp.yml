name: Build KMP shared module (Android + web)

on:
  push:
    branches:
      - web
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  android-and-shared-jvm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          else
            echo "sdkmanager not found under $SDK_ROOT, skipping (licenses are likely already accepted on this image)"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build + test shared module (Android host tests)
        run: ./gradlew :shared:testAndroidHostTest

      - name: Build existing Android app (regression check)
        run: ./gradlew :app:assembleDebug

  # Site web : statique, installable depuis le navigateur (Safari « Sur l'écran d'accueil »).
  web:
    runs-on: ubuntu-latest
    env:
      # Secrets GitHub (Settings > Secrets > Actions) : sans eux, le site est construit mais pas publié.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build web app (WebAssembly)
        run: ./gradlew :shared:wasmJsBrowserDistribution

      - name: Stamp version and version the files
        run: |
          bash scripts/web-release.sh shared/build/dist/wasmJs/productionExecutable ${{ github.run_number }}

      # APK Android téléchargeable depuis le site (surflog.fr/surflog.apk), construit depuis la branche de l'appli (unified : coque Android sur le module partagé, même appli que le site).
      - name: Checkout Android app branch
        uses: actions/checkout@v4
        with:
          ref: unified
          path: apk-src

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then yes | "$SDKMANAGER" --licenses > /dev/null || true; fi

      - name: Fixed signing key (if secrets are set)
        env:
          KS_B64: ${{ secrets.SURFLOG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/surflog.jks"
            echo "SURFLOG_KEYSTORE_PATH=$RUNNER_TEMP/surflog.jks" >> "$GITHUB_ENV"
            echo "SURFLOG_KEYSTORE_PASSWORD=${{ secrets.SURFLOG_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "SURFLOG_KEY_ALIAS=${{ secrets.SURFLOG_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "SURFLOG_KEY_PASSWORD=${{ secrets.SURFLOG_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      # Un échec de l'APK ne doit jamais bloquer la publication du site.
      - name: Build APK and add it to the site
        continue-on-error: true
        working-directory: apk-src
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../shared/build/dist/wasmJs/productionExecutable/surflog.apk
          printf '{"versionCode":%s,"versionName":"1.0.%s"}\n' ${{ github.run_number }} ${{ github.run_number }} > ../shared/build/dist/wasmJs/productionExecutable/apk-version.json

      - name: Screenshot in headless Chrome
        continue-on-error: true
        timeout-minutes: 5
        run: |
          DIST=shared/build/dist/wasmJs/productionExecutable
          (cd "$DIST" && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --window-size=430,932 \
            --virtual-time-budget=20000 --screenshot=web-screenshot.png http://localhost:8080/ || true
          ls -la web-screenshot.png || true

      - name: Upload web app
        uses: actions/upload-artifact@v4
        with:
          name: surflog-web-${{ github.run_number }}
          path: shared/build/dist/wasmJs/productionExecutable
          retention-days: 30

      - name: Upload web screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-screenshot-${{ github.run_number }}
          path: web-screenshot.png
          if-no-files-found: warn
          retention-days: 30

      # Publication sur Cloudflare Pages (surflog.pages.dev, puis surflog.fr une fois le domaine relié).
      # Wrangler lit CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID dans l'environnement.
      - name: Create Cloudflare Pages project (first time only)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        continue-on-error: true
        run: npx --yes wrangler@4 pages project create surflog --production-branch=main

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: >
          npx --yes wrangler@4 pages deploy shared/build/dist/wasmJs/productionExecutable
          --project-name=surflog --branch=main --commit-dirty=true
