name: Build KMP shared module (Android + iOS)

on:
  push:
    branches:
      - ios-kmp-migration
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  android-and-shared-jvm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          else
            echo "sdkmanager not found under $SDK_ROOT, skipping (licenses are likely already accepted on this image)"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build + test shared module (Android host tests)
        run: ./gradlew :shared:testAndroidHostTest --stacktrace

      - name: Build existing Android app (regression check)
        run: ./gradlew :app:assembleDebug --stacktrace

  shared-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build shared framework for iOS Simulator (arm64)
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Run shared module tests on iOS Simulator
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build iOS app for Simulator (unsigned)
        working-directory: iosApp
        run: |
          xcodebuild \
            -project SurfLog.xcodeproj \
            -target SurfLog \
            -sdk iphonesimulator \
            -configuration Debug \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
