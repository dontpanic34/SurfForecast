name: Build KMP shared module (Android + iOS + web)

on:
  push:
    branches:
      - ios-kmp-migration
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  android-and-shared-jvm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          else
            echo "sdkmanager not found under $SDK_ROOT, skipping (licenses are likely already accepted on this image)"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build + test shared module (Android host tests)
        run: ./gradlew :shared:testAndroidHostTest

      - name: Build existing Android app (regression check)
        run: ./gradlew :app:assembleDebug

  shared-ios:
    runs-on: macos-latest
    # Les minutes macOS comptent ~10x : un simulateur bloqué ne doit pas tourner des heures.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build shared framework for iOS Simulator (arm64)
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Run shared module tests on iOS Simulator
        run: ./gradlew :shared:iosSimulatorArm64Test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build iOS app for Simulator (unsigned)
        working-directory: iosApp
        run: |
          xcodebuild \
            -project SurfLog.xcodeproj \
            -target SurfLog \
            -sdk iphonesimulator \
            -configuration Debug \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="1.0.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build

      # Non bloquant : sert à voir l'app tourner (capture téléchargeable en artifact),
      # un souci d'environnement du simulateur ne doit pas faire échouer le build.
      - name: Launch app in Simulator and take a screenshot
        continue-on-error: true
        timeout-minutes: 12
        working-directory: iosApp
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,l in d.items() if "iOS" in r for x in l if x["name"].startswith("iPhone")))')
          echo "Simulator: $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Debug-iphonesimulator/SurfLog.app
          xcrun simctl launch "$DEVICE" com.surfcast.surflog
          sleep 25
          xcrun simctl io "$DEVICE" screenshot ios-screenshot.png

      - name: Upload iOS screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshot-${{ github.run_number }}
          path: iosApp/ios-screenshot.png
          if-no-files-found: warn
          retention-days: 30

  # Version web (remplace l'app iOS) : site statique installable depuis Safari.
  web:
    runs-on: ubuntu-latest
    env:
      # Secrets GitHub (Settings > Secrets > Actions) : sans eux, le site est construit mais pas publié.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build web app (WebAssembly)
        run: ./gradlew :shared:wasmJsBrowserDistribution

      - name: Stamp version
        run: |
          DIST=shared/build/dist/wasmJs/productionExecutable
          sed -i 's/<meta name="app-version" content="dev">/<meta name="app-version" content="1.0.${{ github.run_number }}">/' "$DIST/index.html"
          ls -la "$DIST"

      - name: Screenshot in headless Chrome
        continue-on-error: true
        timeout-minutes: 5
        run: |
          DIST=shared/build/dist/wasmJs/productionExecutable
          (cd "$DIST" && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --window-size=430,932 \
            --virtual-time-budget=20000 --screenshot=web-screenshot.png http://localhost:8080/ || true
          ls -la web-screenshot.png || true

      - name: Upload web app
        uses: actions/upload-artifact@v4
        with:
          name: surflog-web-${{ github.run_number }}
          path: shared/build/dist/wasmJs/productionExecutable
          retention-days: 30

      - name: Upload web screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-screenshot-${{ github.run_number }}
          path: web-screenshot.png
          if-no-files-found: warn
          retention-days: 30

      # Publication sur Cloudflare Pages (surflog.pages.dev, puis surflog.fr une fois le domaine relié).
      # Wrangler lit CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID dans l'environnement.
      - name: Create Cloudflare Pages project (first time only)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        continue-on-error: true
        run: npx --yes wrangler@4 pages project create surflog --production-branch=main

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: >
          npx --yes wrangler@4 pages deploy shared/build/dist/wasmJs/productionExecutable
          --project-name=surflog --branch=main --commit-dirty=true
